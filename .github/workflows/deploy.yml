name: Build & Push Image

on:
  push:
    branches: [main]

# Dua push berdekatan tidak boleh men-deploy bersamaan: recreate container yang
# tumpang-tindih bikin konflik nama ("name is already in use"). Antri, jangan batalkan.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/azera-backend

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build cache (GitHub Actions cache): layer chromium/npm ci yang isinya tidak berubah tetap
      # punya digest sama antar build → VPS cuma unduh layer yang benar-benar berubah (dist),
      # bukan ~440MB tiap deploy. Tanpa ini, tiap push membangun ulang semua layer dari nol.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    # Aktifkan setelah VPS diprovision: set repo variable DEPLOY_ENABLED=true
    # dan secrets VPS_HOST / VPS_USER / VPS_SSH_KEY (lihat deploy/README.md)
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          # Default 10m — koneksi VPS→GHCR kadang melambat di tengah unduhan (lihat 24 Sep 2026)
          command_timeout: 30m
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/azera-deploy
            docker compose pull
            if ! docker compose up -d --remove-orphans; then
              echo "compose up gagal — membersihkan container nyangkut lalu ulang"
              docker compose down --remove-orphans || true
              docker ps -aq --filter "name=azera-deploy" | xargs -r docker rm -f
              docker compose up -d
            fi
            docker image prune -f
